name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Early warning only: never fails the build. A non-zero exit means
      # package.json and package-lock.json have drifted apart; the follow-up
      # install/test/build steps still run so the rest of CI stays informative.
      - name: Check lockfile is in sync
        if: always()
        run: npm ci --dry-run
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
